<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FoodieBot — Your AI Food Assistant</title>
  <meta name="description" content="FoodieBot is an AI-powered food chatbot that helps you with recipes, cooking tips, meal planning, and everything food-related." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Chatbot Container -->
  <div class="chatbot-wrapper" id="chatbot-wrapper">
    <!-- Header -->
    <header class="chat-header" id="chat-header">
      <div class="header-left">
        <div class="bot-avatar-header">
          <span class="avatar-emoji">🍳</span>
          <span class="status-dot"></span>
        </div>
        <div class="header-info">
          <h1 class="bot-name">FoodieBot</h1>
          <span class="bot-status">Online • AI Food Assistant</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="clear-btn" title="Clear chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Messages Area -->
    <main class="chat-messages" id="chat-messages">
      <!-- Welcome message -->
      <div class="welcome-screen" id="welcome-screen">
        <div class="welcome-avatar">🍕</div>
        <h2 class="welcome-title">Hey there, foodie! 👋</h2>
        <p class="welcome-subtitle">I'm <strong>FoodieBot</strong> — your personal AI food assistant. Ask me about recipes, cooking tips, meal ideas, or anything food-related!</p>
        <div class="suggestion-chips">
          <button class="chip" data-message="Give me a quick 15-minute pasta recipe 🍝">Quick pasta recipe 🍝</button>
          <button class="chip" data-message="What's a healthy breakfast idea? 🥗">Healthy breakfast 🥗</button>
          <button class="chip" data-message="Suggest an Indian dinner recipe 🍛">Indian dinner 🍛</button>
          <button class="chip" data-message="What can I make with chicken and rice? 🍗">Chicken & rice ideas 🍗</button>
        </div>
      </div>
    </main>

    <!-- Input Area -->
    <footer class="chat-input-area" id="chat-input-area">
      <div class="input-container">
        <textarea
          id="message-input"
          class="message-input"
          placeholder="Ask me about any recipe or food tip..."
          rows="1"
          maxlength="2000"
        ></textarea>
        <button class="send-btn" id="send-btn" disabled title="Send message">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="powered-by">Powered by OpenAI GPT-4o-mini</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
